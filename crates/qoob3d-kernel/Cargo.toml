[package]
name = "qoob3d-kernel"
description = "QOOB3D geometry kernel: OpenCascade on a dedicated worker thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
qoob3d-core.workspace = true
opencascade.workspace = true
# Same crate opencascade uses; needed to name OCCT types in our own bridge.
opencascade-sys = "0.3"
cxx = "1"
# Must match the glam version used in opencascade's public API.
occt-glam = { package = "glam", version = "0.24" }
thiserror.workspace = true
serde = "1"
serde_json = "1"
tracing.workspace = true
# Script engine of the CAD API (ADR-0053): pure Rust, sandboxed, operation limits.
rhai = "1.27"

[build-dependencies]
cxx-build = "1"

[lints]
workspace = true
