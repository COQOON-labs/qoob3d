[package]
name = "qoob3d-kernel"
description = "QOOB3D geometry kernel: OpenCascade on a dedicated worker thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
qoob3d-core.workspace = true
# OCCT built from source (`builtin`) and its types for our own cxx bridge (ADR-0004).
opencascade-sys = { version = "0.3", features = ["builtin"] }
cxx = "1"
thiserror.workspace = true
serde = "1"
serde_json = "1"
tracing.workspace = true
# Script engine of the CAD API (ADR-0053): pure Rust, sandboxed, operation limits.
rhai = "1.27"

[build-dependencies]
cxx-build = "1"

[lints]
workspace = true
