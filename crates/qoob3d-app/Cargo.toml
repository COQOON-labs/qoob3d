[package]
name = "qoob3d-app"
description = "QOOB3D desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "qoob3d"

[[bin]]
name = "qoob3d"
path = "src/main.rs"

[dependencies]
qoob3d-core.workspace = true
qoob3d-kernel.workspace = true
qoob3d-render.workspace = true
eframe = { workspace = true, features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
glam.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6", features = ["derive"] }
png = "0.18"

[lints]
workspace = true

[dev-dependencies]
# Headless UI tests and screenshots of the real app (ADR-0018).
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
