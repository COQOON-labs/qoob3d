[package]
name = "qoob3d-app"
description = "QOOB3D desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "qoob3d"

[[bin]]
name = "qoob3d"
path = "src/main.rs"

[dependencies]
qoob3d-core.workspace = true
qoob3d-kernel.workspace = true
