[package]
name = "qoob3d-core"
description = "QOOB3D document model and shared data types (no kernel, no GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Mesh import (ADR-0034): inflate for deflated 3MF entries, pull parser for the model XML.
miniz_oxide = "0.9"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
toml = "1"
# Glyph outlines and kerning for `text` (AG-SC-38): pure Rust, maintained (fontations, also
# egui's font reader); `ttf-parser` is unmaintained (RUSTSEC-2026-0192). At least 0.50:
# the `read-fonts` of 0.44 panics on a glyph without points (font/tests.rs).
skrifa = { version = "0.50", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.12"

[lints]
workspace = true
