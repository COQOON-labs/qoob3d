# QOOB3D fork of opencascade-sys 0.3.0 (https://github.com/bschwind/opencascade-rs,
# commit 07e8feb, crates/opencascade-sys). See README.md for the list of
# modifications (ADR-0047).
[package]
name = "opencascade-sys"
version = "0.3.0"
edition = "2021"
authors = ["Brian Schwind <brianmschwind@gmail.com>"]
description = "Rust bindings to the OpenCascade CAD Kernel (QOOB3D fork)"
license = "LGPL-2.1"
repository = "https://github.com/bschwind/opencascade-rs"
publish = false
# QOOB3D: lets dependents read DEP_OCCT_INCLUDE and orders their build scripts
# after this one.
links = "occt"

[features]
builtin = ["occt-sys"]

[dependencies]
cxx = "1"

[build-dependencies]
cmake = "0.1"
cxx-build = "1"
occt-sys = { version = "7.8.1", optional = true }
